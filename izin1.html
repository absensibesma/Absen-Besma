<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Rekap Perizinan</title>
    <style>
        /* ==================== RESET & BASE LAYOUT ==================== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .app-container { display: flex; min-height: 100vh; background-color: #f0f2f5; }

        /* ==================== STYLE SIDEBAR ==================== */
        .sidebar { width: 250px; background-color: #2c3e50; color: #ecf0f1; padding-top: 20px; position: fixed; height: 100vh; font-family: 'Segoe UI', Arial, sans-serif; z-index: 100; }
        .sidebar h2 { text-align: center; color: #ffffff; margin-bottom: 30px; font-size: 20px; letter-spacing: 1px; }
        .sidebar ul { list-style: none; }
        .sidebar ul li a { display: block; color: #bdc3c7; padding: 15px 25px; text-decoration: none; font-size: 16px; transition: all 0.3s ease; }
        .sidebar ul li a:hover { color: #ffffff; background-color: #34495e; padding-left: 35px; }
        .sidebar ul li a.active { background-color: #d97706; color: white; font-weight: bold; }

        /* ==================== MAIN CONTENT AREA ==================== */
        .main-content { flex: 1; margin-left: 250px; padding: 40px; box-sizing: border-box; min-height: 100vh; font-family: 'Segoe UI', Arial, sans-serif; }
        .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; }
        .header-section h1 { color: #2c3e50; font-size: 26px; }

        /* ==================== TABLE STYLE ==================== */
        .table-container { background-color: #ffffff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background-color: #d97706; color: white; padding: 15px 20px; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; text-align: center; }
        td { padding: 15px 20px; border-bottom: 1px solid #e2e8f0; font-size: 15px; color: #334155; }
        tr:hover { background-color: #f8fafc; }
        
        .nama-santri { font-weight: 600; color: #1e3a8a; cursor: pointer; }
        .nama-santri:hover { text-decoration: underline; color: #2563eb; }
        .badge-kamar { background-color: #e2e8f0; color: #334155; padding: 4px 10px; border-radius: 20px; font-size: 13px; font-weight: 600; }
        
        .countdown-active { color: #16a34a; font-weight: bold; background-color: #dcfce7; padding: 4px 10px; border-radius: 6px; }
        .status-expired { color: #dc2626; font-weight: bold; background-color: #fee2e2; padding: 4px 10px; border-radius: 6px; }
        .empty-state { text-align: center; color: #64748b; padding: 4px 0; font-style: italic; font-size: 15px; }

        /* Actions Button */
        .action-buttons { display: flex; justify-content: center; gap: 5px; }
        .btn-action { border: none; padding: 6px 10px; border-radius: 4px; font-size: 13px; cursor: pointer; font-weight: bold; }
        .btn-action.edit { background-color: #f59e0b; color: white; }
        .btn-action.delete { background-color: #10b981; color: white; }

        /* Dropdown detail row */
        .detail-row { background-color: #f8fafc; }
        .detail-container { padding: 15px; border-left: 4px solid #d97706; margin: 5px 20px; background: #fff; border-radius: 4px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); }
        .detail-container p { margin: 6px 0; font-size: 14px; color: #475569; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="app-container">
        <div class="sidebar">
            <h2>ABSENSI BESMA</h2>
            <ul>
                <li><a href="index.html">📝 Form Absensi</a></li>
                <li><a href="list.html">🚪 Daftar Santri</a></li>
                <li><a href="daftar.html">📋 Rekap Absen</a></li>
                <li><a href="rekap.html">📊 Rekap Per Kamar</a></li>
                <li><a href="izin1.html">📝 Daftar Perizinan</a></li>
                <li><a href="history.html">📜 Riwayat Perizinan</a></li>
                <li><a href="izin2.html">🏥 Riwayat Sakit</a></li>
            </ul>
        </div>

        <div class="main-content">
            <div class="header-section">
                <h1>⏳ Daftar Santri dalam Masa Perizinan</h1>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 5%;">No</th>
                            <th style="text-align: left; width: 30%;">Nama Santri</th>
                            <th style="width: 15%;">Kamar</th>
                            <th style="width: 20%;">Durasi / Mulai</th>
                            <th style="width: 15%;">Sisa Waktu</th>
                            <th style="width: 15%;">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabelIzinBody">
                        <tr>
                            <td colspan="6" class="empty-state">Menghubungkan ke database cloud...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

   <script>
        // 1. KONFIGURASI DATABASE FIREBASE CLOUD
        const firebaseConfig = {
            databaseURL: "https://db-asrama-default-rtdb.firebaseio.com/"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // 2. STATE DATA GLOBAL
        let globalDataIzinAsrama = [];

        // 3. FUNGSI LISTEN REALTIME DARI DATABASE FIREBASE
        function tampilkanData() {
            db.ref('dataIzinAsrama').on('value', (snapshot) => {
                const data = snapshot.val();
                globalDataIzinAsrama = data ? (Array.isArray(data) ? data : Object.values(data)) : [];
                renderTabelSesuaiStrukturAsli();
            });
        }

        // 4. LOGIKA HITUNG DURASI YANG DISINKRONKAN DENGAN FORMAT STRUKTUR FORM ASLI (ANTI-NaN)
        function hitungSisaDurasiRealtime(waktuMulai, waktuSelesai, durasiTeksAlternatif) {
            const sekarang = new Date().getTime();
            
            // Mencoba konversi tanggal mulai murni angka atau string biasa
            let tglMulai = isNaN(waktuMulai) ? new Date(String(waktuMulai).replace(' ', 'T')).getTime() : Number(waktuMulai);
            let tglSelesai = isNaN(waktuSelesai) ? new Date(String(waktuSelesai).replace(' ', 'T')).getTime() : Number(waktuSelesai);

            // Jika waktuSelesai kosong/rusak, gunakan data teks durasi cadangan bawaan database agar tidak NaN
            if (isNaN(tglSelesai) || tglSelesai <= 0) {
                return { teks: durasiTeksAlternatif || "Aktif", aktif: true };
            }

            if (isNaN(tglMulai)) {
                return { teks: durasiTeksAlternatif || "Data Tersimpan", aktif: true };
            }

            if (sekarang < tglMulai) {
                return { teks: "Belum Dimulai", aktif: true };
            }

            const selisihSisaWaktu = tglSelesai - sekarang;

            if (selisihSisaWaktu <= 0) {
                return { teks: "Waktu Habis", aktif: false };
            }

            const totalSisaMenit = Math.floor(selisihSisaWaktu / (1000 * 60));
            const totalSisaJam = Math.floor(totalSisaMenit / 60);
            
            const hitungHari = Math.floor(totalSisaJam / 24);
            const sisaJamMurni = totalSisaJam % 24;
            const sisaMenitMurni = totalSisaMenit % 60;

            let teksDurasiFinal = "";
            if (hitungHari > 0) teksDurasiFinal += `${hitungHari} Hari `;
            if (sisaJamMurni > 0 || hitungHari > 0) teksDurasiFinal += `${sisaJamMurni} Jam `;
            teksDurasiFinal += `${sisaMenitMurni} Menit`;

            return { teks: teksDurasiFinal, aktif: true };
        }

        // 5. RENDER PEMBUATAN BARIS TABEL SEPERTI STRUKTUR ASLI (6 KOLOM PASTI MUNCUL)
        function renderTabelSesuaiStrukturAsli() {
            const bodyTabel = document.getElementById('tabelIzinBody');
            if (!bodyTabel) return;
            
            bodyTabel.innerHTML = "";

            if (globalDataIzinAsrama.length === 0) {
                bodyTabel.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#999; padding:20px;">Tidak ada santri yang sedang dalam perizinan aktif.</td></tr>`;
                return;
            }

            let indeksBaris = 0;

            globalDataIzinAsrama.forEach((dataIzin) => {
                if (!dataIzin) return;

                indeksBaris++;
                const idDetailDropdown = `detail_${indeksBaris}`;

                // Mengamankan pemanggilan parameter agar membaca property 'waktuSelesai' ATAU 'waktuKembali' sesuai database Anda
                const targetSelesai = dataIzin.waktuSelesai || dataIzin.waktuKembali || "";
                const durasiRealtime = hitungSisaDurasiRealtime(dataIzin.waktuMulai, targetSelesai, dataIzin.durasiTeks);

                // Format tampilan teks tanggal mulai untuk kolom ke-4
                let tglMulaiTeks = "-";
                if (dataIzin.waktuMulai) {
                    const tglMulaiObj = isNaN(dataIzin.waktuMulai) ? new Date(String(dataIzin.waktuMulai).replace(' ', 'T')) : new Date(Number(dataIzin.waktuMulai));
                    if (!isNaN(tglMulaiObj.getTime())) {
                        tglMulaiTeks = tglMulaiObj.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                    } else {
                        tglMulaiTeks = dataIzin.waktuMulai;
                    }
                }

                // Format tampilan teks rencana kembali untuk detail dropdown
                let tglSelesaiTeks = "-";
                if (targetSelesai) {
                    const tglSelesaiObj = isNaN(targetSelesai) ? new Date(String(targetSelesai).replace(' ', 'T')) : new Date(Number(targetSelesai));
                    if (!isNaN(tglSelesaiObj.getTime())) {
                        tglSelesaiTeks = tglSelesaiObj.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                    } else {
                        tglSelesaiTeks = targetSelesai;
                    }
                }

                // Buat baris utama tr
                const trUtama = document.createElement('tr');
                trUtama.className = "main-row";
                trUtama.style.cursor = "pointer";
                trUtama.onclick = () => toggleDropdown(idDetailDropdown, trUtama);

                // Mengisi 6 kolom tabel secara mutlak (Nama dipastikan muncul paling atas)
                trUtama.innerHTML = `
                    <td style="text-align: center; font-weight: 600;">${indeksBaris}</td>
                    <td><strong class="nama-santri">${dataIzin.nama ? dataIzin.nama.toUpperCase() : 'TANPA NAMA'}</strong></td>
                    <td style="text-align: center;"><span class="badge-kamar">${dataIzin.kamar || '-'}</span></td>
                    <td style="text-align: center; font-size: 13px; color: #555;">${tglMulaiTeks}</td>
                    <td style="text-align: center; font-weight: 600; color: #2c3e50;">
                        <span class="${durasiRealtime.aktif ? 'countdown-active' : 'status-expired'}">${durasiRealtime.teks}</span>
                    </td>
                    <td style="text-align: center;" onclick="event.stopPropagation();">
                        <div class="action-buttons">
                            <button class="btn-action edit" onclick="bukaHalamanEdit('${dataIzin.waktuMulai}', '${dataIzin.nama}', '${dataIzin.kamar}')">✏️</button>
                            <button class="btn-action delete" onclick="prosesHapusIzin('${dataIzin.waktuMulai}', '${dataIzin.nama}')">🗑️</button>
                        </div>
                    </td>
                `;

                // Baris detail dropdown
                const trDetail = document.createElement('tr');
                trDetail.id = idDetailDropdown;
                trDetail.className = "detail-row";
                trDetail.style.display = "none";

                trDetail.innerHTML = `
                    <td colspan="6">
                        <div class="detail-container">
                            <p><strong>Nama Lengkap:</strong> ${dataIzin.nama ? dataIzin.nama.toUpperCase() : '-'}</p>
                            <p><strong>Kamar Asrama:</strong> ${dataIzin.kamar || '-'}</p>
                            <p><strong>Mulai Izin:</strong> ${tglMulaiTeks}</p>
                            <p><strong>Rencana Kembali / Durasi:</strong> ${tglSelesaiTeks} (${dataIzin.durasiTeks || '-'})</p>
                            <p><strong>Keterangan / Alasan:</strong> <span style="color:#c0392b; font-weight:600;">"${dataIzin.keterangan || '-'}"</span></p>
                            <p><strong>Pengurus Pencatat:</strong> ${dataIzin.pengurus || '-'}</p>
                        </div>
                    </td>
                `;

                bodyTabel.appendChild(trUtama);
                bodyTabel.appendChild(trDetail);
            });
        }

        // 6. FUNGSI PROSES HAPUS DATA PERIZINAN 
        function prosesHapusIzin(waktuMulai, nama) {
            if (confirm(`Apakah Anda yakin ingin menghapus data izin atas nama "${nama.toUpperCase()}"?\n\nSantri akan otomatis dianggap kembali ke asrama dan akses absensi di list.html terbuka.`)) {
                db.ref('dataIzinAsrama').once('value').then((snapshot) => {
                    const dataLama = snapshot.val() || [];
                    const dataDitemukan = dataLama.find(item => item && String(item.waktuMulai) === String(waktuMulai) && item.nama === nama);

                    if (dataDitemukan) {
                        db.ref('riwayatIzinAsrama').once('value').then((histSnapshot) => {
                            let listHist = histSnapshot.val() || [];
                            if (!Array.isArray(listHist)) listHist = Object.values(listHist);
                            
                            dataDitemukan.waktuKembaliAsli = new Date().getTime();
                            listHist.push(dataDitemukan);
                            db.ref('riwayatIzinAsrama').set(listHist);
                        });

                        const dataTerupdate = dataLama.filter(item => item && !(String(item.waktuMulai) === String(waktuMulai) && item.nama === nama));
                        db.ref('dataIzinAsrama').set(dataTerupdate);
                    }
                });
            }
        }

        // 7. NAVIGASI EDIT DATA
        function bukaHalamanEdit(waktuMulai, nama, kamar) {
            sessionStorage.setItem('editMode', 'true');
            sessionStorage.setItem('editWaktuMulai', waktuMulai);
            sessionStorage.setItem('tempNama', nama);
            sessionStorage.setItem('tempKamar', kamar);
            window.location.href = 'izin.html';
        }

        // 8. TOGGLE DROPDOWN DETAIL
        function toggleDropdown(id, element) {
            const detailRow = document.getElementById(id);
            if (detailRow.style.display === "table-row") {
                detailRow.style.display = "none"; 
                element.classList.remove("active");
            } else {
                detailRow.style.display = "table-row"; 
                element.classList.add("active");
            }
        }

        // === RUNNING PROGRAM UTAMA ===
        tampilkanData();
        setInterval(renderTabelSesuaiStrukturAsli, 1000); 

        // Penanganan Highlight Active Sidebar
        document.querySelectorAll('.sidebar ul li a').forEach(link => link.classList.remove('active'));
        const namaFileAktif = window.location.pathname.split('/').pop();
        document.querySelectorAll('.sidebar ul li a').forEach(link => {
            const hrefTautan = link.getAttribute('href');
            if (namaFileAktif === hrefTautan || (namaFileAktif === '' && hrefTautan === 'index.html')) {
                link.classList.add('active');
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Presensi Santri</title>
    <style>
        /* ==================== RESET & BASE LAYOUT ==================== */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        .app-container {
            display: flex;
            min-height: 100vh;
            background-color: #f0f2f5;
        }

        /* ==================== STYLE NAVIGATOR (SIDEBAR) ==================== */
        .sidebar {
            width: 250px;
            background-color: #2c3e50;
            color: #ecf0f1;
            padding-top: 20px;
            position: fixed;
            height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            z-index: 100;
        }

        .sidebar h2 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 30px;
            font-size: 20px;
            letter-spacing: 1px;
        }

        .sidebar ul {
            list-style: none;
        }

        .sidebar ul li a {
            display: block;
            color: #bdc3c7;
            padding: 15px 25px;
            text-decoration: none;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .sidebar ul li a:hover {
            color: #ffffff;
            background-color: #34495e;
            padding-left: 35px;
        }

        .sidebar ul li a.active {
            background-color: #3b82f6;
            color: white;
            font-weight: bold;
        }

        /* ==================== AREA KONTEN UTAMA (KANAN) ==================== */
        .main-content {
            margin-left: 250px; 
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
            min-height: 100vh;
        }

        /* ==================== STYLE BOX DATA KAMAR ==================== */
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
        }
        
        .absensi-box { 
            background-color: #ffffff; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); 
            width: 100%; 
            max-width: 800px;
        }
        
        .absensi-box h1 { 
            text-align: center; 
            color: #2c3e50; 
            margin-bottom: 25px; 
            font-size: 24px;
        }

        /* === PANEL AKSI UTAMA & SEARCH === */
        .panel-aksi-utama {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }

        .wrapper-search {
            flex: 1;
            max-width: 300px;
            position: relative;
        }

        .input-search-santri {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }

        .input-search-santri:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        /* === TOMBOL TAMBAH SANTRI BARU === */
        .btn-tambah-santri {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-tambah-santri:hover {
            background-color: #059669;
            transform: translateY(-1px);
        }

        /* === STYLING TOMBOL BARU UNTUK INPUT MASSAL === */
        .btn-tambah-massal {
            background-color: #d97706;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-tambah-massal:hover {
            background-color: #b45309;
            transform: translateY(-1px);
        }

        /* === GRID TOMBOL KAMAR === */
        .grid-kamar { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); 
            gap: 12px; 
            margin-bottom: 10px; 
        }
        .btn-kamar-biasa { 
            background-color: #3b82f6; 
            color: white; 
            border: none; 
            padding: 18px 10px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 8px; 
            transition: all 0.2s;
        }
        .btn-kamar-biasa:hover { 
            background-color: #2563eb; 
            transform: translateY(-2px);
        }
        .badge-count { 
            background: rgba(255, 255, 255, 0.25); 
            padding: 2px 8px; 
            border-radius: 12px; 
            font-size: 11px; 
        }

        /* === AREA HASIL PENCARIAN GLOBAL === */
        .container-hasil-pencarian {
            margin-top: 10px;
            display: none;
        }
        .judul-pencarian {
            font-size: 16px;
            color: #475569;
            margin-bottom: 10px;
            font-weight: 600;
        }

        /* === MODAL POPUP === */
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.5); 
            justify-content: center; 
            align-items: center; 
            z-index: 1000; 
        }
        .modal.show { 
            display: flex; 
        }
        .modal-content { 
            background: white; 
            padding: 25px; 
            border-radius: 12px; 
            width: 90%; 
            max-width: 650px; 
            max-height: 85vh; 
            overflow-y: auto; 
            position: relative; 
        }
        .close-btn { 
            position: absolute; 
            top: 15px; 
            right: 20px; 
            font-size: 24px; 
            cursor: pointer; 
            color: #64748b; 
        }

        /* === PANEL PILIHAN TANGGAL DI MODAL === */
        .panel-tanggal-modal {
            margin: 15px 0 5px 0;
            padding: 12px;
            background-color: #f8fafc;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        .wrapper-tanggal {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .panel-tanggal-modal label {
            font-weight: 700;
            color: #334155;
            font-size: 14px;
        }
        .input-tanggal-modal {
            padding: 6px 12px;
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            font-weight: bold;
            color: #1e293b;
            font-family: inherit;
            cursor: pointer;
            outline: none;
        }
        .input-tanggal-modal:focus {
            border-color: #3b82f6;
        }

        /* === TOMBOL GLOBAL RESET === */
        .btn-reset-global {
            background-color: #dc2626;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-reset-global:hover {
            background-color: #b91c1c;
            transform: translateY(-1px);
        }

        .btn-reset-kamar {
            background-color: #f97316;
            color: white;
            border: none;
            padding: 7px 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-reset-kamar:hover {
            background-color: #ea580c;
        }

        /* === STYLE FORM INPUT DI MODAL TAMBAH === */
        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-group label {
            font-weight: bold;
            color: #475569;
            font-size: 14px;
        }
        .form-control {
            padding: 10px 12px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            font-family: inherit;
        }
        .form-control:focus {
            border-color: #3b82f6;
        }
        .btn-submit-santri {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            width: 100%;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-submit-santri:hover {
            background-color: #2563eb;
        }

        /* === TABEL SISTEM DALAM MODAL & PENCARIAN === */
        .list-table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 5px; 
        }
        .list-table th, .list-table td { 
            padding: 12px 10px; 
            border-bottom: 1px solid #e2e8f0; 
            text-align: left; 
        }
        .list-table th { 
            background-color: #f8fafc; 
            color: #475569; 
            font-weight: 600; 
        }

        /* === TOMBOL TOGGLE STATUS LANGSUNG === */
        .btn-toggle-status {
            padding: 7px 14px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 115px;
            text-align: center;
            display: inline-block;
        }
        .btn-status-hadir {
            background-color: #e2e8f0;
            color: #475569;
        }
        .btn-status-hadir:hover {
            background-color: #cbd5e1;
        }
        .btn-status-absen {
            background-color: #fee2e2;
            color: #dc2626;
            border: 1px solid #fca5a5;
        }
        .btn-status-absen:hover {
            background-color: #fca5a5;
        }
        .btn-status-izin-aktif {
            background-color: #fef3c7;
            color: #d97706;
            border: 1px solid #fde68a;
            cursor: not-allowed;
        }

        /* === TOMBOL HAPUS NAMA === */
        .btn-hapus-santri {
            background-color: #fff1f2;
            color: #e11d48;
            border: 1px solid #fecdd3;
            padding: 6px 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-hapus-santri:hover {
            background-color: #ffe4e6;
            color: #be123c;
            border-color: #fda4af;
        }

        /* === STYLE ROW KHUSUS SINKRONISASI IZIN === */
        .row-terblokir-izin {
            background-color: #f8fafc !important; 
        }
        .row-terblokir-izin td {
            color: #94a3b8 !important; 
        }
        .row-terblokir-izin span {
            color: #94a3b8 !important;
        }
        
        /* BADGE KAMAR DI SEBELAH NAMA */
        .badge-kamar-info {
            background-color: #e0f2fe;
            color: #0369a1;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            margin-left: 6px;
            display: inline-block;
            border: 1px solid #bae6fd;
        }
    </style>
</head>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
        // 1. KONFIGURASI DATABASE FIREBASE CLOUD
        const firebaseConfig = {
            databaseURL: "https://db-asrama-default-rtdb.firebaseio.com/"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // 2. STATE GLOBAL MANAGEMENT
        let globalDataSantriMurni = [];
        let globalDataAbsensiTerpilih = [];
        let statusIzinSantriAktif = []; 
        let kamarAktifSekarang = "";

        // 3. INISIALISASI INPUT TANGGAL (DEFAULT HARI INI)
        function inisialisasiTanggal() {
            const inputTanggal = document.getElementById('tanggalAbsen');
            const hariIni = new Date();
            const zonaWaktuLokal = new Date(hariIni.getTime() - (hariIni.getTimezoneOffset() * 60000));
            const formatStringIsi = zonaWaktuLokal.toISOString().split('T')[0];
            inputTanggal.value = formatStringIsi;

            // Pasang event listener jika tanggal diubah
            inputTanggal.addEventListener('change', () => {
                muatUlangTampilanSesuaiTanggal();
            });
        }

        // 4. REALTIME LISTEN DATABASE FIREBASE CLOUD
        function listenFirebaseData() {
            // Node data master santri
            db.ref('dataMasterSantri').on('value', (snapshot) => {
                const data = snapshot.val();
                globalDataSantriMurni = data ? (Array.isArray(data) ? data : Object.values(data)) : [];
                muatUlangTampilanSesuaiTanggal();
            });

            // Node data absensi harian
            db.ref('dataAbsensiAsrama').on('value', (snapshot) => {
                const data = snapshot.val();
                globalDataAbsensiTerpilih = data ? (Array.isArray(data) ? data : Object.values(data)) : [];
                muatUlangTampilanSesuaiTanggal();
            });

            // Node sinkronisasi izin aktif dari izin1.html
            db.ref('dataIzinAsrama').on('value', (snapshot) => {
                const data = snapshot.val();
                statusIzinSantriAktif = data ? (Array.isArray(data) ? data : Object.values(data)) : [];
                muatUlangTampilanSesuaiTanggal();
            });
        }

        // 5. RE-RENDER FILTER DATA KETIKA TANGGAL / DATABASE BERUBAH
        function muatUlangTampilanSesuaiTanggal() {
            if (kamarAktifSekarang !== "") {
                bukaFormAbsenKamar(kamarAktifSekarang);
            }
        }

        // 6. LOGIKA UTAMA SINKRONISASI DAN CEK RENTANG DURASI IZIN (OTOMATIS TERBLOKIR)
        function cekApakahSantriIzin(namaSantri, kamarSantri, tanggalAbsenDipilih) {
            if (!statusIzinSantriAktif || statusIzinSantriAktif.length === 0) {
                return { status: false, keterangan: "" };
            }

            const namaClean = namaSantri.trim().toUpperCase();
            const kamarClean = kamarSantri.trim().toUpperCase().replace("KAMAR", "").trim();
            
            // Konversi tanggal absen yang dipilih di list.html ke objek Date lokal (00:00:00)
            const tanggalTarget = new Date(tanggalAbsenDipilih + "T00:00:00");

            // Lakukan pengecekan berulang ke seluruh data perizinan aktif
            for (const dataIzin of statusIzinSantriAktif) {
                if (!dataIzin || !dataIzin.nama || !dataIzin.kamar) continue;

                const namaIzin = dataIzin.nama.trim().toUpperCase();
                const kamarIzin = dataIzin.kamar.trim().toUpperCase().replace("KAMAR", "").trim();

                // Cocokkan Nama & Kamar
                if (namaClean === namaIzin && kamarClean === kamarIzin) {
                    // Ekstrak nilai tanggal murni saja (YYYY-MM-DD) dari properti waktuMulai dan waktuSelesai
                    const tglMulaiMurni = new Date(dataIzin.waktuMulai).toISOString().split('T')[0];
                    const tglSelesaiMurni = new Date(dataIzin.waktuSelesai).toISOString().split('T')[0];

                    // Buat objek tanggal netral 00:00:00 untuk pembandingan yang presisi
                    const tanggalMulaiIzin = new Date(tglMulaiMurni + "T00:00:00");
                    const tanggalSelesaiIzin = new Date(tglSelesaiMurni + "T00:00:00");

                    // JIKA tanggal target absen berada dalam rentang masa berlaku izin, maka BLOKIR!
                    if (tanggalTarget >= tanggalMulaiIzin && tanggalTarget <= tanggalSelesaiIzin) {
                        return { 
                            status: true, 
                            keterangan: dataIzin.keterangan || `Izin Resmi Asrama (${dataIzin.durasiTeks || ''})` 
                        };
                    }
                }
            }
            return { status: false, keterangan: "" };
        }

        // 7. MEMBUKA MODAL POPUP INPUT ABSEN PER KAMAR
        function bukaFormAbsenKamar(namaKamar) {
            kamarAktifSekarang = namaKamar;
            const tanggalDipilih = document.getElementById('tanggalAbsen').value;
            
            document.getElementById('judulModal').innerText = `PRESENSI: ${namaKamar.toUpperCase()}`;
            const containerTabel = document.getElementById('kontenTabelSantri');
            containerTabel.innerHTML = "";

            // Filter santri berdasarkan kamar pilihan
            const listSantriKamar = globalDataSantriMurni.filter(s => {
                if (!s || !s.kamar) return false;
                return s.kamar.trim().toUpperCase() === namaKamar.trim().toUpperCase();
            });

            if (listSantriKamar.length === 0) {
                containerTabel.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#999; padding:20px;">Tidak ada data nama santri terdaftar di kamar ini.</td></tr>`;
                document.getElementById('modalFormSantri').classList.add('show');
                return;
            }

            // Render isi data baris tabel santri
            listSantriKamar.forEach((santri) => {
                const tr = document.createElement('tr');
                
                // Ambil status presensi yang sudah tersimpan di tanggal terpilih (jika ada)
                const dataLogLama = globalDataAbsensiTerpilih.find(log => 
                    log.tanggal === tanggalDipilih && 
                    log.nama.trim().toUpperCase() === santri.nama.trim().toUpperCase() &&
                    log.kamar.trim().toUpperCase() === namaKamar.trim().toUpperCase()
                );

                const statusSekarang = dataLogLama ? dataLogLama.status : "";

                // PANGGIL FUNGSI LOGIKA BLOKIR SINKRONISASI 
                const cekIzin = cekApakahSantriIzin(santri.nama, namaKamar, tanggalDipilih);

                if (cekIzin.status) {
                    // JIKA TERDETEKSI IZIN: Tambahkan class CSS terblokir agar tabel berubah warna abu-abu
                    tr.classList.add('row-terblokir-izin');
                    
                    tr.innerHTML = `
                        <td><strong>${santri.nama.toUpperCase()}</strong><br><small style="color:#d97706; font-weight:600;">⚠️ ${cekIzin.keterangan}</small></td>
                        <td style="text-align: center;"><span class="badge-izin-block">Izin Aktif</span></td>
                        <td style="text-align: center;">
                            <button class="btn-opsi-absen" onclick="peringatanIzinAktif('${santri.nama}', '${cekIzin.keterangan}')" style="background:#b3b3b3; color:#fff; cursor:not-allowed; box-shadow:none;">🔒 Terkunci</button>
                        </td>
                    `;
                } else {
                    // JIKA TIDAK IZIN / STATUS NORMAL: Render tombol pilihan Hadir, Sakit, Alpha asli kamu
                    let teksTombolOpsi = "Pilih Status";
                    let classWarnaTombol = "";

                    if (statusSekarang === "Hadir") { teksTombolOpsi = "🟢 Hadir"; classWarnaTombol = "status-hadir"; }
                    else if (statusSekarang === "Sakit") { teksTombolOpsi = "🟡 Sakit"; classWarnaTombol = "status-sakit"; }
                    else if (statusSekarang === "Izin") { teksTombolOpsi = "🟠 Izin"; classWarnaTombol = "status-izin"; }
                    else if (statusSekarang === "Alpha") { teksTombolOpsi = "🔴 Alpha"; classWarnaTombol = "status-alpha"; }

                    tr.innerHTML = `
                        <td><strong>${santri.nama.toUpperCase()}</strong></td>
                        <td style="text-align: center;"><span class="badge-status-absen ${classWarnaTombol}">${statusSekarang || 'Belum Absen'}</span></td>
                        <td style="text-align: center;">
                            <select class="btn-opsi-absen" onchange="prosesSimpanStatusAbsen('${santri.nama}', '${namaKamar}', this.value)">
                                <option value="">-- Ubah --</option>
                                <option value="Hadir" ${statusSekarang === 'Hadir' ? 'selected' : ''}>Hadir</option>
                                <option value="Sakit" ${statusSekarang === 'Sakit' ? 'selected' : ''}>Sakit</option>
                                <option value="Alpha" ${statusSekarang === 'Alpha' ? 'selected' : ''}>Alpha</option>
                            </select>
                        </td>
                    `;
                }
                containerTabel.appendChild(tr);
            });

            document.getElementById('modalFormSantri').classList.add('show');
        }

        // 8. TINDAKAN JIKA PENGURUS MENCOBA MENGKLIK TOMBOL SANTRI YANG SEDANG TERKUNCI IZIN
        function peringatanIzinAktif(nama, alasan) {
            alert(`TINDAKAN DITOLAK!\n\nSantri bernama "${nama.toUpperCase()}" tidak bisa diubah status presensinya melalui halaman ini karena status perizinannya sedang aktif (Sinkronisasi dari halaman Perizinan).\n\nKeterangan Izin: "${alasan}"`);
        }

        // 9. PROSES UPDATE DATA ABSEN KE FIREBASE REALTIME CLOUD 
        function prosesSimpanStatusAbsen(namaInput, kamarInput, statusBaru) {
            if (!statusBaru) return;
            const tanggalAbsen = document.getElementById('tanggalAbsen').value;

            // Jika status dirubah menjadi "Sakit", arahkan otomatis ke formulir rekam medis izin2.html
            if (statusBaru === "Sakit") {
                sessionStorage.setItem('tempNamaSakit', namaInput);
                sessionStorage.setItem('tempKamarSakit', kamarInput);
                sessionStorage.setItem('tempTanggalSakit', tanggalAbsen);
                window.location.href = 'izin2.html';
                return;
            }

            // Bersihkan data lama pada tanggal, nama, dan kamar yang sama agar tidak menumpuk double
            let dataCleanTerupdate = globalDataAbsensiTerpilih.filter(log => 
                !(log.tanggal === tanggalAbsen && 
                  log.nama.trim().toUpperCase() === namaInput.trim().toUpperCase() && 
                  log.kamar.trim().toUpperCase() === kamarInput.trim().toUpperCase())
            );

            // Dorong data status baru ke array cloud
            dataCleanTerupdate.push({
                tanggal: tanggalAbsen,
                kamar: kamarInput,
                nama: namaInput,
                status: statusBaru,
                keterangan: ""
            });

            // Kirim kembali array data final terupdate ke Firebase node 'dataAbsensiAsrama'
            const cleanArrayKirim = dataCleanTerupdate.filter(item => item !== null);
            db.ref('dataAbsensiAsrama').set(cleanArrayKirim)
                .catch((error) => {
                    alert("Gagal mengupdate database cloud: " + error.message);
                });
        }

        // 10. MENUTUP MODAL DIALOG POPUP ABSEN
        function tutupFormSantri(e) { 
            if (e.target.id === 'modalFormSantri') paksaTutupForm(); 
        }
        
        function paksaTutupForm() { 
            document.getElementById('modalFormSantri').classList.remove('show'); 
            kamarAktifSekarang = ""; 
        }

        // === RUNNING PROGRAM UTAMA ===
        inisialisasiTanggal();
        listenFirebaseData();

        // 11. AUTOMATION HIGHLIGHT MENU ACTIVE SIDEBAR
        const namaFileAktif = window.location.pathname.split('/').pop();
        document.querySelectorAll('.sidebar ul li a').forEach(link => {
            link.classList.remove('active');
            const hrefTautan = link.getAttribute('href');
            if (namaFileAktif === hrefTautan || (namaFileAktif === '' && hrefTautan === 'index.html')) {
                link.classList.add('active');
            }
        });
    </script>
</body>
</html>
